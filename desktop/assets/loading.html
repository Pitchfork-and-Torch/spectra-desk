<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spectra Desk</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #06080f;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .wrap { text-align: center; padding: 2rem; }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        filter: drop-shadow(0 0 24px rgba(167, 139, 250, 0.5));
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
        background: linear-gradient(90deg, #67e8f9, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p { color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem; }
      .bar {
        width: 220px;
        height: 3px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        margin: 0 auto;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #22d3ee, #a78bfa);
        border-radius: 999px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      .status {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
        font-size: 0.7rem;
        color: #22d3ee;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="16" y1="2" x2="16" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ddd6fe" />
            <stop offset="100%" stop-color="#7c3aed" />
          </linearGradient>
        </defs>
        <path fill="url(#g)" d="M16 3C9.4 3 5 8.2 5 14.5V26c0 0 2.4-2.2 4.4 0 2 2.2 3.6-1.8 6.6 0 2-2.2 4.4 0 4.4 0V14.5C20 8.2 15.6 3 16 3Z" />
        <ellipse cx="12" cy="14.5" rx="2.1" ry="2.6" fill="#0b1020" opacity="0.88" />
        <ellipse cx="20" cy="14.5" rx="2.1" ry="2.6" fill="#0b1020" opacity="0.88" />
        <circle cx="12.6" cy="13.4" r="0.8" fill="#22d3ee" />
        <circle cx="20.6" cy="13.4" r="0.8" fill="#22d3ee" />
      </svg>
      <h1>Spectra Desk</h1>
      <p>Starting investigation engine…</p>
      <div class="bar"></div>
      <p class="status" id="status">Initializing API &amp; browser automation</p>
    </div>
  </body>
</html>
